name: Install Ubuntu build dependencies
description: >-
  Installs the Qt 6 build dependencies with apt, keeping the downloaded
  packages in the Actions cache. The runners' Ubuntu mirror can be very slow
  (11 minutes for 124 MB has been seen), so a cached run downloads only the
  package index and anything that changed since.

runs:
  using: composite
  steps:
    - name: Work out the cache key
      id: key
      shell: bash
      env:
        PACKAGES: cmake ninja-build pkg-config qt6-base-dev qt6-webengine-dev qt6-svg-dev libgl-dev libsecret-1-dev patchelf
      run: |
        echo "packages=${PACKAGES}" >>"${GITHUB_OUTPUT}"
        hash="$(sha256sum <<<"${PACKAGES}")"
        echo "key=apt-${ImageOS}-${RUNNER_ARCH}-${hash:0:16}" >>"${GITHUB_OUTPUT}"
        echo "prefix=apt-${ImageOS}-${RUNNER_ARCH}-" >>"${GITHUB_OUTPUT}"

    - name: Restore downloaded packages
      uses: actions/cache@v4
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install packages
      shell: bash
      env:
        PACKAGES: ${{ steps.key.outputs.packages }}
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get update
        # shellcheck disable=SC2086 # PACKAGES is a word list
        sudo apt-get install -y --no-install-recommends \
          -o Dir::Cache::Archives="${HOME}/apt-archives" ${PACKAGES}
        # apt ran as root; let the cache action read and save the files.
        sudo chown -R "${USER}" ~/apt-archives
